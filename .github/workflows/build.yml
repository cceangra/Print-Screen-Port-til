name: Build GNU candidate
on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    container: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Build dependencies (CI container only)
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git g++ make pkg-config libx11-dev libpng-dev binutils file python3
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - name: Dynamic GNU/glibc build; enforce actual ABI floor
        run: |
          make -B portable
          ./bin/print-rc --self-test
          python3 scripts/build/manifest.py --output dist/build-manifest.json --max-glibc 2.31 --max-glibcxx 3.4.28
          python3 packaging/portable/package.py --manifest dist/build-manifest.json --output dist/Print-RC-linux-x86_64-glibc.zip
      - uses: actions/upload-artifact@v4
        with:
          name: gnu-x86_64-candidate
          path: dist/*
          if-no-files-found: error
