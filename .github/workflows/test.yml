name: Test exact candidate archive
on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  packaged:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:20.04', 'ubuntu:22.04', 'debian:13']
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Runtime and test dependencies (CI only)
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates g++ make pkg-config libx11-dev libpng-dev binutils file python3 unzip xvfb xauth xdotool xclip x11-xserver-utils passwd
      - uses: actions/download-artifact@v4
        with:
          name: gnu-x86_64-candidate
          path: candidate
      - name: Verify checksum and extract one application directory
        run: |
          cd candidate
          sha256sum -c Print-RC-linux-x86_64-glibc.zip.sha256
          unzip -q Print-RC-linux-x86_64-glibc.zip -d /tmp/candidate
          useradd -m tester
          chown -R tester:tester /tmp/candidate
      - name: Regressions on the packaged binary as a non-root user
        run: |
          su -s /bin/bash tester -c 'cd /tmp/candidate/Print-RC && bash tests/run.sh' > candidate/test-output.log 2>&1 || { cat candidate/test-output.log; exit 1; }
          cat candidate/test-output.log
          cat /etc/os-release > candidate/runtime-os-release.txt
          getconf GNU_LIBC_VERSION > candidate/runtime-libc.txt
          printf '%s\n' 'Xvfb core plus simulated XFCE/Trinity adapters. No real-desktop claim.' > candidate/test-scope.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-evidence-${{ strategy.job-index }}
          path: |
            candidate/test-output.log
            candidate/runtime-*.txt
            candidate/test-scope.txt
          if-no-files-found: warn

  xfce-glibc-235:
    runs-on: ubuntu-22.04
    container: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Isolated Xfce/GDB dependencies (CI only)
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git g++ pkg-config libx11-dev libpng-dev libxcursor1 python3 unzip xvfb xauth xdotool xclip x11-xserver-utils xfce4-settings xfconf dbus-x11 gdb binutils file passwd
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: gnu-x86_64-candidate
          path: candidate
      - name: Prepare actual candidate and preserved v0.5.6 comparison
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p /tmp/xfce-test/original/src /tmp/xfce-test/evidence
          unzip -q candidate/Print-RC-linux-x86_64-glibc.zip -d /tmp/xfce-test
          git show v0.5.6:bin/print-rc > /tmp/xfce-test/legacy-static
          chmod +x /tmp/xfce-test/legacy-static
          getconf GNU_LIBC_VERSION > /tmp/xfce-test/evidence/libc.txt
          cat /etc/os-release > /tmp/xfce-test/evidence/os-release.txt
          readelf -Wn /tmp/xfce-test/legacy-static > /tmp/xfce-test/evidence/legacy-build-id.txt
          sha256sum /tmp/xfce-test/legacy-static /tmp/xfce-test/Print-RC/bin/print-rc > /tmp/xfce-test/evidence/binary-sha256.txt
          git show v0.5.6:src/main.cpp > /tmp/xfce-test/original/src/main.cpp
          git show v0.5.6:src/settings.hpp > /tmp/xfce-test/original/src/settings.hpp
          g++ -std=c++17 -O2 -g /tmp/xfce-test/original/src/main.cpp -o /tmp/xfce-test/original-dynamic $(pkg-config --cflags --libs x11 libpng)
          useradd -m tester
          chown -R tester:tester /tmp/xfce-test
      - name: Real Xfce shortcut services and unchanged-source/static forensic comparison
        run: |
          su -s /bin/bash tester -c 'timeout 100s dbus-run-session -- xvfb-run -a -s "-screen 0 1024x768x24 -noreset" bash /tmp/xfce-test/Print-RC/tests/test_xfce_real.sh /tmp/xfce-test/Print-RC /tmp/xfce-test/legacy-static /tmp/xfce-test/original-dynamic /tmp/xfce-test/evidence' > /tmp/xfce-test/evidence/session.log 2>&1 || { cat /tmp/xfce-test/evidence/session.log; exit 1; }
          cat /tmp/xfce-test/evidence/session.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xfce-glibc-235-evidence
          path: /tmp/xfce-test/evidence/*
          if-no-files-found: warn
