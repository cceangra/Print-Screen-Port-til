name: Compilar e testar Print RC
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar bibliotecas de compilacao
        run: sudo apt-get update && sudo apt-get install -y g++ make pkg-config libx11-dev libpng-dev python3
      - name: Compilar e verificar PNG
        run: make test
      - name: Testar integracao conservadora do Trinity (ambiente simulado)
        run: python3 -m unittest discover -s tests -v
      - name: Conferir sintaxe do instalador
        run: bash -n instalar.sh && bash -n desinstalar.sh && bash -n iniciar.sh
      - name: Testar pasta unica e mudanca de destino
        run: bash tests/test_instalacao.sh
      - name: Disponibilizar binario experimental Linux x86_64
        uses: actions/upload-artifact@v4
        with:
          name: print-rc-linux-x86_64
          path: bin/print-rc
