name: Print RC candidate checks
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      source_ref: ${{ github.event.pull_request.head.sha || github.sha }}
  test:
    needs: build
    uses: ./.github/workflows/test.yml
    with:
      source_ref: ${{ github.event.pull_request.head.sha || github.sha }}
