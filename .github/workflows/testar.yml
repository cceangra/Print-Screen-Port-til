name: Compilar e empacotar Print RC portatil
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bibliotecas necessarias somente no ambiente de construcao do GitHub
        run: sudo apt-get update && sudo apt-get install -y g++ make binutils file pkg-config libx11-dev libpng-dev python3 zip xvfb xdotool
      - name: Compilar executavel estatico x86_64
        run: |
          make portable
          ./bin/print-rc --self-test
          ./bin/print-rc --version | grep -F 'Print RC 0.4.2'
          test "$(uname -m)" = x86_64
          ! readelf -l bin/print-rc | grep -q INTERP
          file bin/print-rc | grep -q 'statically linked'
      - name: Testar atalhos do Trinity em ambiente simulado
        run: python3 -m unittest discover -s tests -v
      - name: Testar instalacao em pasta unica sem pacotes
        run: |
          bash -n instalar.sh desinstalar.sh iniciar.sh configurar.sh
          bash tests/test_instalacao.sh
      - name: Testar desinstalacao sem apagar nenhuma imagem
        run: bash tests/test_desinstalacao.sh
      - name: Testar configuracao interativa e escrita de PNG
        run: |
          bash tests/test_configuracao.sh
          g++ -std=c++17 -O2 -Wall -Wextra tests/test_settings.cpp -o /tmp/test-print-rc-settings
          /tmp/test-print-rc-settings
      - name: Testar UI em X11 virtual (sem ambiente do usuario)
        run: timeout 60s xvfb-run -a -s '-screen 0 1024x768x24' bash tests/test_gui_x11.sh
      - name: Testar recusa do teclado ocupado e liberacao do mouse X11
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra tests/test_keyboard_grab.cpp -o /tmp/print-rc-keyboard-test $(pkg-config --libs x11)
          timeout 25s xvfb-run -a -s '-screen 0 1024x768x24' /tmp/print-rc-keyboard-test "$PWD/bin/print-rc"
      - name: Criar pacote em ZIP com um unico diretorio e executavel incluido
        run: |
          set -euo pipefail
          mkdir -p /tmp/Print-RC/bin
          cp -a Makefile LICENSE README.md instalar.sh iniciar.sh desinstalar.sh configurar.sh src scripts /tmp/Print-RC/
          cp bin/print-rc /tmp/Print-RC/bin/print-rc
          (cd /tmp && zip -qr "$GITHUB_WORKSPACE/Print-RC-Linux-x86_64.zip" Print-RC)
          unzip -l Print-RC-Linux-x86_64.zip | grep 'Print-RC/bin/print-rc'
      - name: Salvar pacote como artefato do GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Print-RC-Linux-x86_64
          path: Print-RC-Linux-x86_64.zip
          if-no-files-found: error
      - name: Publicar o ZIP na aba Releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && hashFiles('.github/release-0.4.2.ready') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.4.2 >/dev/null 2>&1; then
            echo 'A tag v0.4.2 ja existe: manter ZIP publicado sem sobrescrever.'
            exit 0
          fi
          gh release create v0.4.2 Print-RC-Linux-x86_64.zip \
            --title 'Print RC v0.4.2 - Teclado e atalho seguros' \
            --notes 'Corrige falha em XGrabKeyboard sem travar mouse/teclado; verifica conflitos do Trinity antes de gravar o atalho; desinstala apenas arquivos originais com inventario SHA-256 dentro da pasta e preserva capturas e arquivos pessoais. Pacote C++ estatico para X11 x86_64. Sem instalacao de pacotes adicionais.'
      - name: Incluir o executavel estatico no codigo do GitHub (Download ZIP)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- bin/print-rc
          if ! git diff --cached --quiet; then
            git commit -m 'Empacotar executavel estatico no repositorio [skip ci]'
            git push origin HEAD:main
          fi
